[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools"]

[project]
name = "simsio"
version = "2.0.0"
authors = [{ name = "Marco Rigobello" }]
description = "Run numerical scientific simulations and manage I/O."
readme = "README.rst"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy", "dpath>=2.1.2", "dictdiffer", "ruamel.yaml"]

[project.urls]
Homepage = "https://github.com/rgbmrc/simsio"
Repository = "https://github.com/rgbmrc/simsio.git"

[project.optional-dependencies]
dev = ["pre-commit"]
hdf5 = ["h5py", "hickle"]
tenpy = ["physics-tenpy"]

[tool.ruff.lint]
extend-ignore = ["E741", "F403", "F405"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
